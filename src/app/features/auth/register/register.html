<div class="min-h-screen bg-slate-950 flex items-center justify-center p-6 relative overflow-hidden">
  <!-- Background Glow Effect -->
  <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[400px] h-[400px] bg-cyan-600/15 blur-[120px] rounded-full pointer-events-none"></div>

  <div class="w-full max-w-md bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-3xl p-8 shadow-2xl relative z-10 space-y-6">
    
    <!-- Header -->
    <div class="text-center space-y-2">
      <a routerLink="/" class="inline-block text-2xl font-extrabold text-white tracking-wider">
        Task<span class="text-indigo-500">Flow</span>
      </a>
      <h2 class="text-xl font-semibold text-slate-200">Create Account</h2>
      <p class="text-sm text-slate-400">Join TaskFlow to streamline your productivity</p>
    </div>

    <!-- Register Form (Only HTML UI) -->
    <form class="space-y-4">
      <!-- Name Field -->
      <div>
        <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">Full Name</label>
        <input 
          type="text" 
          placeholder="John Doe"
          class="w-full bg-slate-800/80 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 text-sm focus:outline-none transition-all"
        />
      </div>

      <!-- Email Field -->
      <div>
        <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">Email Address</label>
        <input 
          type="email" 
          placeholder="name@company.com"
          class="w-full bg-slate-800/80 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 text-sm focus:outline-none transition-all"
        />
      </div>

      <!-- Password Field -->
      <div>
        <label class="block text-xs font-medium text-slate-300 uppercase tracking-wider mb-2">Password</label>
        <input 
          type="password" 
          placeholder="••••••••"
          class="w-full bg-slate-800/80 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-slate-200 placeholder-slate-500 text-sm focus:outline-none transition-all"
        />
      </div>

      <!-- Submit Button -->
      <button 
        type="button" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition-all text-center mt-2"
      >
        Register
      </button>
    </form>

    <!-- Footer Link -->
    <p class="text-center text-sm text-slate-400">
      Already have an account? 
      <a routerLink="/login" class="text-indigo-400 hover:text-indigo-300 font-medium">Sign In</a>
    </p>
  </div>
</div>
