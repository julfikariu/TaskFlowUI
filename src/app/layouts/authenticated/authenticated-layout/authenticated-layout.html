<div class="min-h-screen bg-slate-950 text-white">

  <div class="flex min-h-screen">

    <!-- Sidebar -->
    <aside class="w-64 border-r border-slate-800 bg-slate-900">
      <div class="p-6">
        <h1 class="text-xl font-bold">
          Task<span class="text-indigo-500">Flow</span>
        </h1>
      </div>

      <nav class="px-4">
        <a
          routerLink="/dashboard"
          routerLinkActive="bg-indigo-600"
          class="block rounded-lg px-4 py-3 text-sm text-slate-300 hover:bg-slate-800"
        >
          Dashboard
        </a>

        <a
          routerLink="/projects"
          routerLinkActive="bg-indigo-600"
          class="mt-2 block rounded-lg px-4 py-3 text-sm text-slate-300 hover:bg-slate-800"
        >
          Projects
        </a>

        <a
          routerLink="/tasks"
          routerLinkActive="bg-indigo-600"
          class="mt-2 block rounded-lg px-4 py-3 text-sm text-slate-300 hover:bg-slate-800"
        >
          Tasks
        </a>
      </nav>
    </aside>

    <!-- Main -->
    <div class="flex min-w-0 flex-1 flex-col">

      <!-- Navbar -->
      <header class="border-b border-slate-800 bg-slate-900">
        <div class="flex items-center justify-between px-6 py-4">
          <h2 class="text-lg font-semibold">
            TaskFlow
          </h2>

          <button
            type="button"
            (click)="logout()"
            class="rounded-lg bg-red-600 px-4 py-2 text-sm font-medium hover:bg-red-500"
          >
            Logout
          </button>
        </div>
      </header>

      <!-- Page -->
      <main class="flex-1 p-6">
        <router-outlet />
      </main>

    </div>

  </div>

</div>
